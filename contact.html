<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrapcontact5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        onerror="this.onerror=null;this.href='vendor/bootstrap.min.css'">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-iconscontact1.11.3/font/bootstrap-icons.css" rel="stylesheet"
        onerror="this.onerror=null;this.href='vendor/bootstrap-icons/bootstrap-icons.css'">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wghtcontact400;600;700&family=Cormorant+Garamond:ital,wghtcontact0,500;1,500&display=swap"
        rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body data-page="contact">
    <div id="ld"></div><canvas id="bg"></canvas>
    <div id="cur"></div>
    <nav class="navbar navbar-expand-lg fixed-top nv">
        <div class="container"><a class="navbar-brand" href="index.html">Portfolio<span>.</span></a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#m" aria-label="Menu"><span
                    class="hb"></span></button>
            <div class="collapse navbar-collapse" id="m">
                <ul class="navbar-nav ms-auto">
                    <li><a class="nav-link" data-n="home" href="index.html">Home</a></li>
                    <li><a class="nav-link" data-n="about" href="about.html">About</a></li>
                    <li><a class="nav-link" data-n="skills" href="skills.html">Skills</a></li>
                    <li><a class="nav-link" data-n="portfolio" href="portfolio.html">Portfolio</a></li>
                    <li><a class="nav-link" data-n="contact" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main>
        <header class="ph" data-art="contact">
            <div class="container">
                <p class="eyebrow">CONTACT</p>
                <h1 class="grad">Let's work together</h1>
                <p class="lead2">Tell me about your idea. I will get back to you soon.</p>
            </div>
        </header>

        <section class="sec">
            <div class="container">
                <div class="row g-5">
                    <div class="col-lg-7 reveal">
                        <form id="cf" class="needs-validation" novalidate>
                            <div class="row g-3">
                                <div class="col-md-6"><input class="form-control" name="name" placeholder="Full name"
                                        required></div>
                                <div class="col-md-6"><input class="form-control" type="email" name="email"
                                        placeholder="Email" required></div>
                                <div class="col-12"><input class="form-control" name="subject" placeholder="Subject"
                                        required></div>
                                <div class="col-12"><textarea class="form-control" name="message" rows="7"
                                        placeholder="Message" required minlength="10"></textarea></div>
                                <div class="col-12"><button class="btn-n border-0" type="submit">Send Message <i
                                            class="bi bi-send"></i></button> <span id="cfs"
                                        class="ms-3 text-secondary"></span></div>
                            </div>
                        </form>
                    </div>
                    <div class="col-lg-5">
                        <div class="gc reveal"><i class="bi bi-broadcast"></i>
                            <h4>Availability</h4>
                            <p id="avail"></p>
                        </div>
                        <div id="direct"></div>
                    </div>
                </div>
            </div>
        </section>
        <section class="sec">
            <div class="container">
                <h2 class="st reveal"><small>FAQ</small>Common questions</h2>
                <div class="accordion reveal" id="faq"></div>
            </div>
        </section>
        <section class="sec">
            <div class="container text-center reveal">
                <h2 class="st"><small>FOLLOW</small>Find me online</h2>
                <div class="soc justify-content-center" id="soc"></div>
            </div>
        </section>
    </main>
    <footer class="ft">
        <div class="soc" id="socF"></div>
        <p>© <span id="yr"></span> <span class="nm"></span> · Static site for GitHub Pages</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        onerror="this.onerror=null;var s=document.createElement('script');s.src='vendor/bootstrap.bundle.min.js';document.head.append(s)"></script>
    <script src="js/main.js"></script>
</body>

</html>
